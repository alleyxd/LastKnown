[project]
name = "tidemark"
version = "0.1.0"
description = "Long-term memory for local LLM agents that knows when a memory is no longer true."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ali Ashter" }]
dependencies = ["openai>=1.40", "numpy", "sentence-transformers"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["tidemark"]
